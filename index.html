<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente Progetto Universitario</title>
<meta name="description" content="Workspace locale per costruire un progetto universitario passo dopo passo: consegna, linee guida, fasi, controlli, revisioni, scadenze e relazione.">
<meta name="theme-color" content="#1e2a3d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assistente Progetto">
<link rel="stylesheet" href="style.css?v=190">
<!-- Librerie esterne opzionali: se offline l'app funziona comunque (formule mostrate come testo LaTeX, grafici come tabella dati) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous"></script>
</head>
<body>
<noscript><p style="padding:20px">Questa applicazione richiede JavaScript attivo.</p></noscript>

<div class="app" id="app">
  <!-- ============ SIDEBAR ============ -->
  <div class="sidebar-backdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar" aria-label="Navigazione principale">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">AP</div>
      <div>
        <div class="brand-name">Assistente Progetto</div>
        <div class="brand-sub">Workspace universitario</div>
      </div>
    </div>
    <div class="proj-switch">
      <label class="sr-only" for="project-select">Progetto attivo</label>
      <select id="project-select" aria-label="Progetto attivo"></select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><button class="mode-toggle" id="mode-toggle" data-action="mode-toggle"></button><span id="side-note">Dati salvati solo in questo browser.</span><br><span id="app-version"></span></div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="btn icon ghost menu-btn" data-action="toggle-sidebar" aria-label="Apri menu">☰</button>
      <div class="search adv" role="search">
        <span class="s-ico" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>
        <label class="sr-only" for="global-search">Ricerca globale</label>
        <input id="global-search" type="search" placeholder="Cerca in progetto, indicazioni, errori, relazione…  (Ctrl+K)" autocomplete="off">
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <button class="btn sm primary" data-action="upload" data-tip="Carica PDF, Word, testo: l'app lo legge e lo elabora (puoi anche trascinare i file sulla pagina)">⇪ Carica un file</button>
      <button class="btn sm hide-sm adv" data-action="question-quick" data-tip="Aggiungi alle domande per il professore">＋ Domanda prof.</button>
      <button class="btn sm icon" data-action="toggle-theme" aria-label="Cambia tema chiaro/scuro" data-tip="Tema chiaro/scuro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
      <div class="save-status" id="save-status" role="status" aria-live="polite"></div>
      <div class="sync-status" id="tr-status" hidden></div>
      <div class="sync-status" id="sync-status" role="status" aria-live="polite" hidden></div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="print-area"></div>
<input type="file" id="hidden-file" hidden>

<!-- Script applicazione (script classici, niente moduli: funziona anche aprendo il file con doppio click) -->
<script src="js/utils.js?v=190"></script>
<script src="js/db.js?v=190"></script>
<script src="js/state.js?v=190"></script>
<script src="js/checker.js?v=190"></script>
<script src="js/ai.js?v=190"></script>
<script src="js/demo.js?v=190"></script>
<script src="js/ui.js?v=190"></script>
<script src="js/views.js?v=190"></script>
<script src="js/views2.js?v=190"></script>
<script src="js/extract.js?v=190"></script>
<script src="js/upload.js?v=190"></script>
<script src="js/live.js?v=190"></script>
<script src="js/translate.js?v=190"></script>
<script src="js/docx.js?v=190"></script>
<script src="js/remote.js?v=190"></script>
<script src="js/sync.js?v=190"></script>
<script src="js/app.js?v=190"></script>
</body>
</html>
